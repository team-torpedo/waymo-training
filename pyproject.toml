[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waymo-training"
version = "0.1.0"
description = "Configurable camera training pipeline (YOLO object detection + TensorFlow lane segmentation) for the Waymo Open Dataset."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Team Torpedo" }]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "opencv-python-headless",
  "pillow",
  "tqdm",
]

[project.optional-dependencies]
tf = ["tensorflow>=2.16", "tensorboard"]
yolo = ["ultralytics>=8.3"]
all = ["tensorflow>=2.16", "tensorboard", "ultralytics>=8.3"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/team-torpedo/waymo-training"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"stages/*" = ["E402"]
"main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
